# FFI graph (standalone workspace). License and git allow-lists are from a
# real `cargo deny --manifest-path xmtp-ffi/Cargo.toml check` run.

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[advisories]
unmaintained = "workspace"
# Vulns in the pinned libxmtp v1.10.0 graph. Not independently upgradeable here.
ignore = [
    { id = "RUSTSEC-2026-0204", reason = "crossbeam-epoch via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0258", reason = "h2 via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0069", reason = "hpke-rs 0.4 via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0070", reason = "hpke-rs 0.4 via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0071", reason = "hpke-rs 0.4 via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0072", reason = "hpke-rs-rust-crypto via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0209", reason = "libcrux-aesgcm via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0211", reason = "libcrux-aesgcm via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0124", reason = "libcrux-chacha20poly1305 via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0023", reason = "libcrux-ecdh via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0026", reason = "libcrux-ed25519 via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0075", reason = "libcrux-ed25519 via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0073", reason = "libcrux-poly1305 via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0212", reason = "libcrux-secrets via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0074", reason = "libcrux-sha3 via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0207", reason = "libcrux-sha3 via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0208", reason = "libcrux-sha3 via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0220", reason = "ruint via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki via libxmtp v1.10.0" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki via libxmtp v1.10.0" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
unused-allowed-source = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Current v1.10.0 graph plus the v1.11.0 git sources the upgrade will need.
allow-git = [
    "https://github.com/xmtp/libxmtp",
    "https://github.com/ephemerahq/diesel",
    "https://github.com/cryspen/hpke-rs",
    "https://github.com/xmtp/hpke-rs",
    "https://github.com/xmtp/openmls",
    "https://github.com/xmtp/tracing-oslog",
]
